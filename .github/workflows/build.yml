name: build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PICO_SDK_VERSION: 2.3.1

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board: [pico, pico2]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install nanopb generator deps
        run: pip install -r lib/nanopb/extra/requirements.txt

      - name: Fetch pico-sdk
        run: |
          git clone --depth 1 -b "$PICO_SDK_VERSION" https://github.com/raspberrypi/pico-sdk "$RUNNER_TEMP/pico-sdk"
          git -C "$RUNNER_TEMP/pico-sdk" submodule update --init --depth 1 lib/tinyusb

      - name: Configure
        run: cmake -S . -B build -G Ninja -DPICO_BOARD=${{ matrix.board }} -DPICO_SDK_PATH="$RUNNER_TEMP/pico-sdk"

      - name: Build
        run: cmake --build build

      - uses: actions/upload-artifact@v4
        with:
          name: calcmesh-${{ matrix.board }}
          path: |
            build/calcmesh.uf2
            build/calcmesh.elf
